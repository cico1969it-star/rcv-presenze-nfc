<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RCV Presenze</title>
  
  <!-- Google Fonts: Barlow Condensed per i testi -->
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div id="overlayInizializzazione" class="overlay">
    <div class="overlay-contenuto">
      <img src="rcv-logo.png" alt="Logo" style="width: 80px; margin-bottom: 20px;">
      <p class="overlay-testo">INIZIALIZZAZIONE<br>IN CORSO...</p>
      <div class="spinner"></div>
    </div>
  </div>
  
  <header class="app-header">
    <img src="rcv-logo.png" alt="Logo RCV" class="header-logo">
    <div class="header-testi">
      <h1>ROMA CLUB VERONA</h1>
      <p class="sottotitolo">Registrazione Presenza</p>
    </div>
  </header>
  
  <button id="startBtn" class="btn-scan" onclick="startScan()">AVVIA SCANSIONE</button>
  <button id="stopBtn" class="btn-stop" onclick="stopScan()" style="display:none;">FERMA SCANSIONE</button>
  
  <button id="btnToggleManuale" onclick="toggleInserimentoManuale()" class="btn-manuale">
    INSERIMENTO MANUALE
  </button>

  <div id="containerManuale" style="display: none; margin-top: 10px;">
    <div style="display: flex; gap: 10px;">
      <input type="text" id="inputManuale" placeholder="Nome Cognome" 
             style="flex: 1; padding: 12px; border-radius: 8px; border: none; font-size: 18px; color: var(--blu-roma); background: var(--bianco); letter-spacing: 0.5px;"
             onkeydown="if(event.key === 'Enter') registrazioneManuale()">
      <button id="btnSalvaManuale" onclick="registrazioneManuale()" 
              style="width: auto; padding: 12px 24px; background: var(--giallo-roma); color: var(--blu-roma); margin-top: 0; font-size: 18px; border-radius: 8px; border: none; cursor: pointer; font-weight: 600;">
        SALVA
      </button>
    </div>
  </div>
  
  <div class="btn-container">
    <button id="btnEstrai" class="btn-estrai" onclick="estraiFortunato()">ESTRAI</button>
    <button id="btnArchivia" class="btn-archivia" onclick="archiviaGiornata()">ARCHIVIA</button>
  </div>
  
  <p id="status">In attesa...</p>
  <p id="vincitore"></p>

  <hr>
  <h3>PRESENTI OGGI (<span id="conteggio">0</span>)</h3>
  <button id="btnAggiorna" class="btn-aggiorna" onclick="caricaLista()">AGGIORNA ELENCO</button>
  <ul id="lista-presenze"></ul>
  
  <script src="script.js"></script>
</body>
</html>
