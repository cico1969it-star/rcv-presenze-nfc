<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin NFC</title>
  <style>
    body { font-family: sans-serif; text-align: center; padding: 20px; background: #2c3e50; color: white; margin: 0; }
    h1 { font-size: 24px; margin-bottom: 20px; }
    button { padding: 15px 25px; font-size: 16px; border: none; border-radius: 8px; cursor: pointer; width: 100%; margin-top: 10px; font-weight: bold; }
    .btn-scan { background: #27ae60; color: white; }
    .btn-stop { background: #c0392b; color: white; }
    .btn-estrai { background: #f39c12; color: white; }
    .btn-archivia { background: #9b59b6; color: white; }
    .btn-aggiorna { background: #3498db; color: white; padding: 10px 20px; font-size: 14px; }
    #status { margin-top: 20px; font-size: 20px; color: #ecf0f1; min-height: 30px; }
    #vincitore { margin-top: 20px; font-size: 28px; color: #2ecc71; font-weight: bold; min-height: 40px; }
    .listening { color: #2ecc71; font-weight: bold; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
    hr { border-color: #7f8c8d; margin: 25px 0; }
    h3 { margin: 15px 0 10px 0; font-size: 20px; }
    #lista-presenze { list-style: none; padding: 0; text-align: left; max-width: 400px; margin: 0 auto; }
    #lista-presenze li { background: #34495e; padding: 12px; margin: 8px 0; border-radius: 8px; border-left: 5px solid #2ecc71; font-size: 18px; }
    .btn-container { display: flex; gap: 10px; }
    .btn-container button { flex: 1; }
  </style>
</head>
<body>
  <h1>🛡️ Pannello Admin NFC</h1>
  
  <button id="startBtn" class="btn-scan" onclick="startScan()">📡 AVVIA SCANSIONE</button>
  <button id="stopBtn" class="btn-stop" onclick="stopScan()" style="display:none;">⏹️ FERMA SCANSIONE</button>
  
  <div style="display: flex; gap: 10px; margin-top: 10px;">
    <input type="text" id="inputManuale" placeholder="✍️ Inserimento Manuale" 
           style="flex: 1; padding: 12px; border-radius: 8px; border: none; font-size: 16px; color: #2c3e50;"
           onkeydown="if(event.key === 'Enter') registrazioneManuale()">
    <button id="btnManuale" onclick="registrazioneManuale()" 
            style="width: auto; padding: 12px 18px; background: #16a085; color: white; margin-top: 0; font-size: 18px;">➕</button>
  </div>
  
  <div class="btn-container">
    <button id="btnEstrai" class="btn-estrai" onclick="estraiFortunato()">🎲 ESTRAI</button>
    <button id="btnArchivia" class="btn-archivia" onclick="archiviaGiornata()">🗄️ ARCHIVIA</button>
  </div>
  
  <p id="status">In attesa...</p>
  <p id="vincitore"></p>

  <hr>
  <h3>📋 Presenti Oggi (<span id="conteggio">0</span>)</h3>
  <button class="btn-aggiorna" onclick="caricaLista()">🔄 Aggiorna Elenco</button>
  <ul id="lista-presenze"></ul>

  <script>
    // ⚠️ INCOLLA QUI IL TUO URL DI GOOGLE APPS SCRIPT ⚠️
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyMeHxt1EXJ3tfwRJ_m4Tl6hkaYajAI7yJplV4r-Fw4wPx3_nKC5Q9O1t4Lry_WvF3Pxg/exec";

    let isScanning = false;
    let hardwareStarted = false;
    let ndefReader = null;
    let presentiOggi = [];

    function playBeep(duplicato) {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.frequency.value = duplicato ? 300 : 800; 
      gain.gain.value = 0.1; osc.start();
      setTimeout(() => osc.stop(), 150);
    }

    async function checkStatoGiornata() {
    try {
      const response = await fetch(SCRIPT_URL + "?action=checkStato");
      const data = await response.json();

      const btnEstrai = document.getElementById('btnEstrai');
      const btnArchivia = document.getElementById('btnArchivia');
      const startBtn = document.getElementById('startBtn');

      if (data.giaArchiviato) {
        // GIORNATA CHIUSA: blocca tutti i pulsanti
        startBtn.disabled = true;
        startBtn.style.background = "#7f8c8d";
        btnArchivia.disabled = true;
        btnArchivia.style.background = "#7f8c8d";
        btnArchivia.innerText = "🗄️ GIÀ ARCHIVIATO";
        btnEstrai.disabled = true;
        btnEstrai.style.background = "#7f8c8d";
        document.getElementById('status').innerText = "🗄️ Giornata archiviata: sistema chiuso per oggi.";
        document.getElementById('inputManuale').disabled = true;
        document.getElementById('btnManuale').disabled = true;
        document.getElementById('btnManuale').style.background = "#7f8c8d";
        if (data.giaEstratto) {
          btnEstrai.innerText = "🏆 ESTRATTO: " + data.vincitore;
          document.getElementById('vincitore').innerText = "🏆 " + data.vincitore;
        }
        return;
      }

      if (data.giaEstratto) {
        btnEstrai.disabled = true;
        btnEstrai.style.background = "#7f8c8d";
        btnEstrai.innerText = "🏆 ESTRATTO: " + data.vincitore;
        document.getElementById('vincitore').innerText = "🏆 " + data.vincitore;
        document.getElementById('status').innerText = "Estrazione già effettuata oggi.";
      }
    } catch (error) { console.error("Errore controllo stato", error); }
  }
    
    async function caricaLista() {
      const listaEl = document.getElementById('lista-presenze');
      const conteggioEl = document.getElementById('conteggio');
      listaEl.innerHTML = '<li style="text-align:center; color:#bdc3c7;">Caricamento...</li>';
      
      try {
        const response = await fetch(SCRIPT_URL);
        const dati = await response.json();
        presentiOggi = dati;
        
        listaEl.innerHTML = '';
        if (presentiOggi.length === 0) {
          listaEl.innerHTML = '<li style="text-align:center; color:#bdc3c7;">Nessuna presenza oggi.</li>';
        } else {
          presentiOggi.slice().reverse().forEach(nome => {
            const li = document.createElement('li');
            li.innerText = nome;
            listaEl.appendChild(li);
          });
        }
        conteggioEl.innerText = presentiOggi.length;
      } catch (error) {
        listaEl.innerHTML = '<li style="color:red;">Errore caricamento</li>';
      }
    }

    function aggiungiAllaListaVisiva(nome) {
      if (presentiOggi.includes(nome)) return;
      presentiOggi.push(nome);
      document.getElementById('conteggio').innerText = presentiOggi.length;
      
      const listaEl = document.getElementById('lista-presenze');
      if (listaEl.innerText.includes('Nessuna presenza')) listaEl.innerHTML = '';
      
      const li = document.createElement('li');
      li.innerText = nome;
      listaEl.insertBefore(li, listaEl.firstChild);
    }

    async function startScan() {
      const status = document.getElementById('status');
      if (!("NDEFReader" in window)) { status.innerText = "❌ Usa Chrome su Android!"; return; }
      try {
        if (!ndefReader) {
          ndefReader = new NDEFReader();
          ndefReader.onreading = event => {
            if (!isScanning) return;
            const textDecoder = new TextDecoder();
            let nomeTrovato = null;
            for (const record of event.message.records) {
              if (record.recordType === "text") nomeTrovato = textDecoder.decode(record.data);
            }
            if (nomeTrovato) inviaAlFoglio(nomeTrovato);
          };
          ndefReader.onreadingerror = () => {};
        }
        if (!hardwareStarted) { await ndefReader.scan(); hardwareStarted = true; }
        isScanning = true;
        document.getElementById('startBtn').style.display = 'none';
        document.getElementById('stopBtn').style.display = 'block';
        status.innerHTML = '<span class="listening">🟢 IN ASCOLTO... Avvicina la card</span>';
      } catch (error) { status.innerText = "❌ Errore: " + error.message; }
    }

    function stopScan() {
      isScanning = false;
      document.getElementById('startBtn').style.display = 'block';
      document.getElementById('stopBtn').style.display = 'none';
      document.getElementById('status').innerText = "⏸️ Scansione fermata.";
    }

    function registrazioneManuale() {
      const input = document.getElementById('inputManuale');
      const nome = input.value.trim();
      if (!nome) {
        document.getElementById('status').innerText = "⚠️ Scrivi prima il nome del socio!";
        return;
      }
      inviaAlFoglio(nome); // Usa lo stesso canale della lettura NFC (con tutti i controlli!)
      input.value = "";
    }
    
    function normalizzaNome(testo) {
      return testo.toString().replace(/\s+/g, ' ').trim().toUpperCase();
    }
    
    function inviaAlFoglio(testo) {
      testo = normalizzaNome(testo); // Spazi puliti + TUTTO MAIUSCOLO
      const status = document.getElementById('status');
      navigator.vibrate(100); 
      fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify({testoLetto: testo}) })
      .then(response => response.json())
      .then(data => {
        if (data.status === "duplicato") {
          status.innerText = "⚠️ Già presente: " + testo;
          navigator.vibrate([100, 50, 100]); playBeep(true);
        } else if (data.status === "archiviato") {
          status.innerText = "⚠️ Giornata già archiviata!";
          navigator.vibrate([100, 50, 100]); playBeep(true);
        } else {
          status.innerText = "✅ Registrato: " + testo;
          playBeep(false);
          aggiungiAllaListaVisiva(testo);
        }
        setTimeout(() => { if(isScanning) status.innerHTML = '<span class="listening">🟢 IN ASCOLTO... Avvicina la card</span>'; }, 2000);
      })
      .catch(err => { status.innerText = "❌ Errore di rete"; });
    }

    async function estraiFortunato() {
      const status = document.getElementById('status');
      const vincitore = document.getElementById('vincitore');
      status.innerText = "🎲 Estrazione in corso...";
      vincitore.innerText = "";
      
      try {
        if (presentiOggi.length === 0) {
          await caricaLista();
          if (presentiOggi.length === 0) { status.innerText = "⚠️ Nessuna presenza oggi!"; return; }
        }
        
        let conteggio = 0;
        const intervallo = setInterval(() => {
          const casuale = presentiOggi[Math.floor(Math.random() * presentiOggi.length)];
          vincitore.innerText = casuale;
          conteggio++;
          if (conteggio > 20) {
            clearInterval(intervallo);
            const vincitoreFinale = presentiOggi[Math.floor(Math.random() * presentiOggi.length)];
            vincitore.innerText = "🏆 " + vincitoreFinale;
            status.innerText = "✅ Estratto da " + presentiOggi.length + " presenze!";
            
            // Salva il vincitore su Google Sheets
            fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify({nomeVincitore: vincitoreFinale}) })
            .then(response => response.json())
            .then(data => {
              if (data.status === "duplicato") {
                status.innerText = "⚠️ Estrazione già fatta oggi!";
                document.getElementById('btnEstrai').disabled = true;
                checkStatoGiornata(); // Aggiorna la UI
              } else {
                status.innerText += " (Salvato!)";
                document.getElementById('btnEstrai').disabled = true;
              }
            });
          }
        }, 100);
      } catch (error) { status.innerText = "❌ Errore: " + error.message; }
    }

    async function archiviaGiornata() {
      const status = document.getElementById('status');
      if (!confirm("Sei sicuro di voler archiviare la giornata? Le presenze verranno spostate nello storico.")) return;
      
      status.innerText = "🗄️ Archiviazione in corso...";
      
      try {
        const response = await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify({action: "archivia"}) });
        const data = await response.json();
        
        if (data.status === "successo") {
          status.innerText = "✅ Archiviate " + data.count + " presenze!";
          presentiOggi = [];
          caricaLista();
          checkStatoGiornata(); // Chiude i pulsanti
        } else if (data.status === "gia_archiviato") {
          status.innerText = "⚠️ Giornata già archiviata!";
          checkStatoGiornata();
        } else {
          status.innerText = "❌ Errore archiviazione";
        }
      } catch (error) {
        status.innerText = "❌ Errore di rete";
      }
    }

    window.onload = function() {
      caricaLista();
      checkStatoGiornata();
    };
  </script>
</body>
</html>
