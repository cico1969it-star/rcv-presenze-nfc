<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin NFC</title>
  <style>
    body { font-family: sans-serif; text-align: center; padding: 30px; background: #2c3e50; color: white; }
    button { padding: 20px 40px; font-size: 20px; border: none; border-radius: 10px; cursor: pointer; width: 100%; margin-top: 20px; font-weight: bold;}
    .btn-scan { background: #27ae60; color: white; }
    .btn-stop { background: #c0392b; color: white; }
    .btn-estrai { background: #f39c12; color: white; }
    #status { margin-top: 25px; font-size: 22px; color: #ecf0f1; min-height: 30px; }
    #vincitore { margin-top: 30px; font-size: 32px; color: #2ecc71; font-weight: bold; min-height: 50px; }
    .listening { color: #2ecc71; font-weight: bold; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
  </style>
</head>
<body>
  <h1>🛡️ Pannello Admin</h1>
  
  <button id="startBtn" class="btn-scan" onclick="startScan()">📡 AVVIA SCANSIONE CONTINUA</button>
  <button id="stopBtn" class="btn-stop" onclick="stopScan()" style="display:none;">⏹️ FERMA SCANSIONE</button>
  <button class="btn-estrai" onclick="estraiFortunato()">🎲 ESTRAI FORTUNATO</button>
  
  <p id="status">In attesa...</p>
  <p id="vincitore"></p>

  <script>
    // ⚠️ INCOLLA QUI IL TUO URL DI GOOGLE APPS SCRIPT ⚠️
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyMeHxt1EXJ3tfwRJ_m4Tl6hkaYajAI7yJplV4r-Fw4wPx3_nKC5Q9O1t4Lry_WvF3Pxg/exec";

    let ndefReader = null;
    let scanController = null;

    // Funzione per emettere un bip
    function playBeep(duplicato) {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      // Se duplicato suona più basso, altrimenti alto
      osc.frequency.value = duplicato ? 300 : 800; 
      gain.gain.value = 0.1;
      osc.start();
      setTimeout(() => osc.stop(), 150);
    }

    async function startScan() {
      const status = document.getElementById('status');
      if (!("NDEFReader" in window)) {
        status.innerText = "❌ Usa Chrome su Android!"; return;
      }
      try {
        scanController = new AbortController();
        ndefReader = new NDEFReader();

        // 1. PRIMA diciamo al browser cosa fare quando legge una card
        ndefReader.onreading = event => {
          // Sicurezza: se nel frattempo abbiamo premuto stop, ignora la lettura
          if (!scanController || scanController.signal.aborted) return;

          const textDecoder = new TextDecoder();
          let nomeTrovato = null;
          for (const record of event.message.records) {
            if (record.recordType === "text") {
              nomeTrovato = textDecoder.decode(record.data);
            }
          }
          if (nomeTrovato) {
            inviaAlFoglio(nomeTrovato);
          }
        };

        // Ignoriamo gli errori di lettura silenziosi per non intasare lo schermo
        ndefReader.onreadingerror = () => {};

        // 2. SOLO DOPO accendiamo l'antenna NFC
        await ndefReader.scan({ signal: scanController.signal });

        // 3. Aggiorniamo l'interfaccia
        document.getElementById('startBtn').style.display = 'none';
        document.getElementById('stopBtn').style.display = 'block';
        status.innerHTML = '<span class="listening">🟢 IN ASCOLTO... Avvicina la card</span>';

      } catch (error) {
        status.innerText = "❌ Errore: " + error.message;
      }
    }

    function stopScan() {
      if (scanController) {
        scanController.abort(); // Questo è il comando che spegne davvero l'antenna!
        scanController = null;
      }
      document.getElementById('startBtn').style.display = 'block';
      document.getElementById('stopBtn').style.display = 'none';
      document.getElementById('status').innerText = "⏸️ Scansione fermata.";
    }

    async function estraiFortunato() {
      // ... (lascia invariato il codice dell'estrazione che avevi prima) ...
      const status = document.getElementById('status');
      const vincitore = document.getElementById('vincitore');
      status.innerText = "🎲 Estrazione in corso...";
      vincitore.innerText = "";
      try {
        const response = await fetch(SCRIPT_URL);
        const presenze = await response.json();
        if (presenze.length === 0) { status.innerText = "⚠️ Nessuna presenza oggi!"; return; }
        let conteggio = 0;
        const intervallo = setInterval(() => {
          const casuale = presenze[Math.floor(Math.random() * presenze.length)];
          vincitore.innerText = casuale;
          conteggio++;
          if (conteggio > 20) {
            clearInterval(intervallo);
            const vincitoreFinale = presenze[Math.floor(Math.random() * presenze.length)];
            vincitore.innerText = "🏆 " + vincitoreFinale;
            status.innerText = "✅ Estratto da " + presenze.length + " presenze!";
          }
        }, 100);
      } catch (error) { status.innerText = "❌ Errore: " + error.message; }
    }
  </script>
</body>
</html>
